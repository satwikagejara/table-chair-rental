<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table &amp; Chairs Rental Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-6 py-5">
      <h1 class="text-2xl font-bold text-slate-900">Table &amp; Chairs Rental Marketplace</h1>
      <p class="text-sm text-slate-500 mt-1">Browse available tables and chairs from local event vendors.</p>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-8">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      {% for item in items %}
      <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm flex flex-col justify-between">
        <div>
          <span class="inline-block text-xs font-semibold uppercase tracking-wide px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700">
            {{ item.category }}
          </span>
          <h2 class="text-lg font-semibold text-slate-900 mt-3">{{ item.name }}</h2>
          <p class="text-sm text-slate-500 mt-1">Vendor: {{ item.vendor }}</p>
        </div>

        <div class="mt-5 pt-4 border-t border-slate-100 flex items-center justify-between">
          <span class="text-lg font-bold text-slate-900">${{ "%.2f"|format(item.price_per_day) }} <span class="text-xs font-normal text-slate-500">/ day</span></span>
          <span class="text-sm font-medium text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full">
            {{ item.total_stock }} in stock
          </span>
        </div>
      </div>
      {% endfor %}
    </div>
  </main>
</body>
</html>
